name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # `pip install dftfig` has to work for someone who has never seen this repository, so
  # the wheel is built, checked with twine, installed into a clean environment and then
  # asked to do something - a package that imports but whose console script is missing
  # passes every other check in this workflow.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the metadata PyPI will render
        run: python -m twine check --strict dist/*

      - name: Install the wheel into a clean environment and run the CLI
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          DFTFIG_NO_TUI=1 /tmp/fresh/bin/dft --version
          DFTFIG_NO_TUI=1 /tmp/fresh/bin/dft params theory.functional
          /tmp/fresh/bin/python -c "import dftfig; print(dftfig.__file__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dftfig-dist
          path: dist/*
